<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>十五键笔画 · 打字练习</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang SC",sans-serif;background:#f2f2f7;color:#1c1c1e;
     display:flex;flex-direction:column;height:100vh;overflow:hidden;user-select:none}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid #e5e5ea}
.title{font-size:15px;font-weight:600;margin-right:auto}
.tabs{display:flex;gap:6px}
.tab{padding:5px 12px;border-radius:14px;background:#f2f2f7;font-size:13px;color:#3a3a3c;border:none}
.tab.on{background:#1c1c1e;color:#fff}
.stats{display:flex;gap:14px;padding:8px 14px;background:#fff;border-bottom:1px solid #e5e5ea;font-size:12px;color:#8e8e93}
.stats b{color:#1c1c1e;font-size:15px;font-variant-numeric:tabular-nums}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:14px;overflow:auto}
.target{font-size:96px;line-height:1.1;font-weight:500;letter-spacing:2px}
.target.small{font-size:64px}
.hint{font-size:15px;color:#8e8e93;letter-spacing:6px;min-height:22px}
.hint span{display:inline-block;min-width:28px;text-align:center}
.hint .ok{color:#34c759;font-weight:600}
.hint .cur{color:#1c1c1e;border-bottom:2px solid #1c1c1e}
.entry{font-size:26px;letter-spacing:10px;font-family:ui-monospace,Menlo,monospace;color:#1c1c1e;min-height:34px}
.entry .bad{color:#ff3b30}
.feedback{font-size:14px;height:20px;color:#34c759}
.feedback.bad{color:#ff3b30}
.kb{background:#d1d1d6;padding:6px;display:flex;flex-direction:column;gap:6px;padding-bottom:max(6px,env(safe-area-inset-bottom))}
.row{display:flex;gap:6px}
.key{flex:1;height:52px;border-radius:9px;background:#fff;box-shadow:0 1px 0 #898a8d;
     display:flex;flex-direction:column;align-items:center;justify-content:center;
     font-size:19px;line-height:1.05;transition:transform .06s,background .1s}
.key small{font-size:9px;color:#8e8e93;margin-top:1px}
.key.down{transform:scale(.94);background:#e5e5ea}
.key.accent{background:#fff}
.key .ch{font-size:20px}
.func{flex:1;height:44px;border-radius:9px;background:#adb5bd;box-shadow:0 1px 0 #898a8d;
      display:flex;align-items:center;justify-content:center;font-size:13px;color:#1c1c1e}
.func.on{background:#1c1c1e;color:#fff}
@media (max-width:400px){.target{font-size:76px}.key{height:46px}}
</style>
</head>
<body>
<header>
  <div class="title">十五键打字</div>
  <div class="tabs">
    <button class="tab on" data-m="char">单字</button>
    <button class="tab" data-m="word">词组</button>
  </div>
</header>
<div class="stats">
  <span>得分 <b id="score">0</b></span>
  <span>正确率 <b id="acc">—</b></span>
  <span>速度 <b id="spd">—</b></span>

<main>
  <div class="target" id="target">十</div>
  <div class="hint" id="hint"></div>
  <div class="entry" id="entry"></div>
  <div class="feedback" id="fb"></div>
</main>
<div class="kb" id="kb"></div>

const NAME = {q:'一',w:'丨',e:'丿',r:'丶',t:'乛',a:'十',s:'口',d:'厂',f:'亠',g:'亻',h:'讠',j:'勹',k:'扌',l:'了',m:'禾头'};
const ROWS = [['q','w','e','r','t'],['a','s','d','f','g'],['h','j','k','l','m']];

let mode = 'char';         // char | word
let list = [];             // 当前题库
let cursor = 0;
let cur = null;            // [text, code]
let typed = '';
let score = 0, total = 0, right = 0, streak = 0;
let t0 = null, doneCount = 0;

const $ = id => document.getElementById(id);
const target = $('target'), hint = $('hint'), entry = $('entry'), fb = $('fb');

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function rebuild(){
  if(mode === 'char'){
    list = DATA.chars.slice(0, 500);
  } else {
    list = DATA.words.slice();
  }
  shuffle(list);
  cursor = 0;
  next();
}

function next(){
  if(cursor >= list.length){ shuffle(list); cursor = 0; }
  cur = list[cursor++];
  typed = '';
  target.textContent = cur[0];
  target.classList.toggle('small', cur[0].length > 1);
  // 提示：单字/词组显示每个码对应的部件名；认键模式不提示（否则等于给答案）
  hint.innerHTML = cur[1].split('').map((c,i)=>
    `<span class="${i<typed.length?'ok':''}">${NAME[c]}</span>`).join('');
  entry.textContent = '';
  fb.textContent = '';
  fb.className = 'feedback';
}

function bump(){
  const now = Date.now();
  if(!t0) t0 = now;
}

function finish(ok){
  total++;
  if(ok){ right++; streak++; score += 10 + streak*2; }
  else { streak = 0; score = Math.max(0, score - 5); }
  doneCount++;
  const el = (Date.now() - t0)/1000/60;
  $('score').textContent = score;
  $('acc').textContent = total ? Math.round(right/total*100)+'%' : '—';
  $('spd').textContent = el > 0.02 ? (doneCount/el).toFixed(0)+' 字/分' : '—';
  $('streak').textContent = streak;
  setTimeout(next, ok ? 220 : 900);
}

function press(k){
  bump();
  if(!cur) return;
  const want = cur[1][typed.length];
  const key = document.querySelector(`.key[data-k="${k}"]`);
  if(key){ key.classList.add('down'); setTimeout(()=>key.classList.remove('down'), 90); }
  if(k === want){
    typed += k;
    entry.innerHTML = typed.split('').map(c=>`<span class="ok" style="color:#34c759">${c}</span>`).join('');
    hint.innerHTML = cur[1].split('').map((c,i)=>
      `<span class="${i<typed.length?'ok':(i===typed.length?'cur':'')}">${NAME[c]}</span>`).join('');
    if(typed.length === cur[1].length){
      fb.textContent = '✓';
      finish(true);
    }
  } else {
    entry.innerHTML = typed.split('').map(c=>`<span class="ok" style="color:#34c759">${c}</span>`).join('') +
      `<span class="bad">${k}</span>`;
    fb.textContent = '✗ 正确：' + cur[1] + '（' + cur[1].split('').map(c=>NAME[c]).join('') + '）';
    fb.className = 'feedback bad';
    finish(false);
  }
}

function buildKb(){
  const kb = $('kb');
  ROWS.forEach((row, ri) => {
    const div = document.createElement('div');
    div.className = 'row';
    row.forEach(k => {
      const b = document.createElement('button');
      b.className = 'key';
      b.dataset.k = k;
      b.innerHTML = `<span class="ch">${NAME[k]}</span><small>${k}</small>`;
      b.onclick = () => press(k);
      div.appendChild(b);
    });
    kb.appendChild(div);
  });
  const fr = document.createElement('div');
  fr.className = 'row';
  [['跳过','skip'],['重新开始','reset']].forEach(([t, a]) => {
    const b = document.createElement('button');
    b.className = 'func';
    b.textContent = t;
    b.onclick = () => {
      if(a === 'skip'){ typed=''; next(); }
      else { score=0;total=0;right=0;streak=0;doneCount=0;t0=null; $('score').textContent=0;
             $('acc').textContent='—'; $('spd').textContent='—'; $('streak').textContent=0; rebuild(); }
    };
    fr.appendChild(b);
  });
  kb.appendChild(fr);
}

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if(KEYS.includes(k)){ e.preventDefault(); press(k); }
  else if(e.key === 'Escape'){ typed=''; next(); }
});

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
    t.classList.add('on');
    mode = t.dataset.m;
    score=0;total=0;right=0;streak=0;doneCount=0;t0=null;
    $('score').textContent=0;$('acc').textContent='—';$('spd').textContent='—';$('streak').textContent=0;
    rebuild();
  };
});

buildKb();
rebuild();
</script>
</body>
</html>
